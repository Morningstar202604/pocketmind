name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    env:
      # 与各测试脚本默认值保持一致（tests/*.py 默认 /tmp/pa-test），
      # 避免服务数据目录与测试检查目录错位
      AGENT_HOME: /tmp/pa-test
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agentd/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r agentd/requirements.txt
          pip install ruff

      - name: Compile check
        run: python -m compileall agentd/ -q

      - name: Ruff lint
        run: ruff check agentd/ tests/

      - name: P0 单元回归（不需启动服务）
        run: python smoke/p0_regression_test.py

      - name: Set up faketermux stubs
        run: bash tests/setup_faketermux.sh

      - name: Start mock server
        run: |
          export PATH="/tmp/faketermux:$PATH"
          rm -rf "$AGENT_HOME"
          nohup python -m agentd.main --mock --port 8799 > /tmp/agentd-ci.log 2>&1 &
          echo $! > /tmp/agentd-ci.pid
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:8799/api/health >/dev/null 2>&1; then
              echo "server ready"
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8799/api/health

      - name: Run end-to-end regression tests
        run: |
          python smoke/m5_regression.py
          python smoke/p0_queue_test.py
          python smoke/p1_jobs_test.py

      # 此前只有上面 4 个套件进门禁：安全专项、配方、健壮性/性能泄漏、MCP、Telegram
      # 全部"能跑但没人跑"，而问题恰好集中在这些区域（配方校验、令牌打码、部署引导）。
      - name: Run security / recipe / robustness suites
        run: |
          python tests/security_test.py
          python smoke/p2_plan_recipe_test.py
          python smoke/p3_robustness_api.py
          python smoke/p3_robustness_unit.py
          python smoke/p3_perf_leak_test.py

      - name: Run MCP & Telegram gateway tests
        run: |
          python smoke/test_mcp_server.py
          python smoke/test_telegram_gateway.py

      - name: 部署链路自检（--lan 无令牌拒启 / AGENT_TOKEN 引导 / --clear-token）
        run: |
          set -e
          rm -rf /tmp/pa-lan
          # 1) 没有令牌时，--lan 必须拒绝启动（否则等于把服务裸露在局域网）
          if AGENT_HOME=/tmp/pa-lan python -m agentd.main --lan --port 8798 --mock >/tmp/lan1.log 2>&1; then
            echo "✗ 无令牌却以 --lan 启动了"; cat /tmp/lan1.log; exit 1
          fi
          grep -q "必须配置访问令牌" /tmp/lan1.log
          # 2) 注入 AGENT_TOKEN 后应正常起来，并把令牌写进 config.json
          rm -rf /tmp/pa-lan
          AGENT_HOME=/tmp/pa-lan AGENT_TOKEN=ci-smoke-token python -m agentd.main --lan --port 8798 --mock >/tmp/lan2.log 2>&1 &
          LAN_PID=$!
          for i in $(seq 1 15); do
            curl -sf http://127.0.0.1:8798/api/health >/dev/null && break
            sleep 1
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8798/api/jobs)
          if [ "$code" != "401" ]; then echo "✗ 未带令牌应 401，实际 $code"; kill $LAN_PID; exit 1; fi
          curl -sf -H "Authorization: Bearer ci-smoke-token" http://127.0.0.1:8798/api/jobs >/dev/null
          kill $LAN_PID
          # 3) 忘记令牌的恢复入口：--clear-token（配合 --home 定位数据目录）后本机免令牌可用
          python -m agentd.main --home /tmp/pa-lan --clear-token
          python -c "import json;c=json.load(open('/tmp/pa-lan/config.json'));assert c['server'].get('token','x')=='',c['server'];print('clear-token + --home 定位生效')"
          rm -rf /tmp/pa-lan

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/agentd-ci.log

  frontend:
    name: Frontend (typecheck + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentd/web
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: agentd/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -b --noEmit

      - name: Unit tests (Vitest)
        run: npm run test

      - name: Build
        run: npm run build

      - name: Verify dist freshness
        run: |
          # 确保提交的 dist 与 src 构建产物一致（手机端零 Node 构建，dist 入库）
          if [ -n "$(git status --porcelain dist/)" ]; then
            echo "::error::dist/ 与 src 构建产物不一致，请重新 build 并提交"
            git diff --stat dist/
            exit 1
          fi

  # E2E（Playwright）：浏览器下载较重，默认不随 PR/push 跑，
  # 只在 workflow_dispatch（Actions 页面手动触发）时执行，避免拖慢常规 CI。
  e2e:
    name: E2E (Playwright, manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentd/web
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agentd/requirements.txt

      - name: Install backend deps
        run: pip install -r agentd/requirements.txt

      - name: Set up faketermux stubs
        run: bash tests/setup_faketermux.sh

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: agentd/web/package-lock.json

      - name: Install frontend deps
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E
        run: npm run test:e2e
        env:
          # webServer 会从仓库根目录启动 mock 后端；PATH 前置 faketermux 桩
          AGENT_HOME: /tmp/agentd-e2e
          PATH: /tmp/faketermux:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
