name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    env:
      # 与各测试脚本默认值保持一致（tests/*.py 默认 /tmp/pa-test），
      # 避免服务数据目录与测试检查目录错位
      AGENT_HOME: /tmp/pa-test
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agentd/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r agentd/requirements.txt
          pip install ruff

      - name: Compile check
        run: python -m compileall agentd/ -q

      - name: Ruff lint
        run: ruff check agentd/ tests/

      - name: P0 单元回归（不需启动服务）
        run: python tests/p0_regression_test.py

      - name: Set up faketermux stubs
        run: bash tests/setup_faketermux.sh

      - name: Start mock server
        run: |
          export PATH="/tmp/faketermux:$PATH"
          rm -rf "$AGENT_HOME"
          nohup python -m agentd.main --mock --port 8799 > /tmp/agentd-ci.log 2>&1 &
          echo $! > /tmp/agentd-ci.pid
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:8799/api/health >/dev/null 2>&1; then
              echo "server ready"
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8799/api/health

      - name: Run end-to-end regression tests
        run: |
          python tests/m5_regression.py
          python tests/p0_queue_test.py
          python tests/p1_jobs_test.py

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/agentd-ci.log

  frontend:
    name: Frontend (typecheck + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentd/web
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: agentd/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -b --noEmit

      - name: Unit tests (Vitest)
        run: npm run test

      - name: Build
        run: npm run build

      - name: Verify dist freshness
        run: |
          # 确保提交的 dist 与 src 构建产物一致（手机端零 Node 构建，dist 入库）
          if [ -n "$(git status --porcelain dist/)" ]; then
            echo "::error::dist/ 与 src 构建产物不一致，请重新 build 并提交"
            git diff --stat dist/
            exit 1
          fi

  # E2E（Playwright）：浏览器下载较重，默认不随 PR/push 跑，
  # 只在 workflow_dispatch（Actions 页面手动触发）时执行，避免拖慢常规 CI。
  e2e:
    name: E2E (Playwright, manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentd/web
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agentd/requirements.txt

      - name: Install backend deps
        run: pip install -r agentd/requirements.txt

      - name: Set up faketermux stubs
        run: bash tests/setup_faketermux.sh

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: agentd/web/package-lock.json

      - name: Install frontend deps
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E
        run: npm run test:e2e
        env:
          # webServer 会从仓库根目录启动 mock 后端；PATH 前置 faketermux 桩
          AGENT_HOME: /tmp/agentd-e2e
          PATH: /tmp/faketermux:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
