# 口袋 Agent · nginx 反向代理（http://<host>/ → agentd 8787）
# 说明：
#   - 前端由 agentd 直接托管（dist 内置于仓库），nginx 只做反代与 SSE 透传
#   - SSE 长连接需要关闭缓冲，下面已配置（proxy_buffering off）
#   - 生产环境建议补 HTTPS（certbot / 云厂商证书），此处给出 HTTP 版本
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # SSE 流式回复：必须关闭缓冲，否则前端收不到逐帧事件
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
    }

    # /api/health 不经过鉴权，可被监控探活
    location = /api/health {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
